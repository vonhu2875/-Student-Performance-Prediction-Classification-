<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dự đoán kết quả học tập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h2 class="text-center mb-4">Dự đoán Đậu/Rớt</h2>
                <form action="/predict" method="post">
                    <div class="mb-3">
                        <label class="form-label">Tên sinh viên:</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tỉ lệ đi học (%):</label>
                        <input type="number" name="attendance" class="form-control" step="0.1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số giờ học/tuần:</label>
                        <input type="number" name="study_hours" class="form-control" step="0.1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Điểm kỳ trước:</label>
                        <input type="number" name="prev_grade" class="form-control" step="0.1" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Dự đoán ngay</button>
                </form>

                {% if result %}
                <div class="mt-4 alert alert-info">
                    <h5>Kết quả cho: {{ name }}</h5>
                    <p>Dự đoán: <strong>{{ result }}</strong></p>
                    <p>Độ tin cậy: {{ prob }}%</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
